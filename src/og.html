<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#faf8f3;
    background-image:
      radial-gradient(circle at 20% 14%, rgba(122,93,18,.06), transparent 44%),
      radial-gradient(circle at 82% 10%, rgba(122,93,18,.05), transparent 42%),
      linear-gradient(180deg,#fffdf9 0%,#faf8f3 40%,#f2ede2 100%);
    font-family:"Optima","Palatino Linotype",Palatino,Georgia,serif;
    color:#1c1814;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;position:relative;
  }
  /* the entablature: a heavy gold band top and bottom, as cut into stone */
  .band{position:absolute;left:0;right:0;height:10px}
  .band.top{top:0;background:linear-gradient(90deg,rgba(184,145,32,.3),#c9a227,rgba(184,145,32,.3))}
  .band.bot{bottom:0;background:linear-gradient(90deg,rgba(184,145,32,.3),#c9a227,rgba(184,145,32,.3))}
  .frame{position:absolute;inset:34px;border:2px solid rgba(122,93,18,.34)}
  .frame::before{content:"";position:absolute;inset:9px;border:1px solid rgba(122,93,18,.18)}

  .spqr{font-size:22px;letter-spacing:.44em;text-transform:uppercase;
    color:#7a5d12;margin-bottom:34px}
  h1{font-size:82px;line-height:1.06;font-weight:400;letter-spacing:.02em;
    margin-bottom:30px;color:#1c1814}
  .rule{display:flex;align-items:center;gap:20px;margin-bottom:30px}
  .rule i{display:block;width:130px;height:2px;
    background:linear-gradient(90deg,transparent,#c9a227)}
  .rule i.r{background:linear-gradient(90deg,#c9a227,transparent)}
  .rule span{color:#7a5d12;font-size:20px;letter-spacing:.3em}
  .creed{font-family:"Iowan Old Style",Palatino,Georgia,serif;
    font-size:31px;color:#4a423a;line-height:1.5}
  .creed b{color:#7a5d12;font-weight:600}
  .foot{position:absolute;bottom:70px;left:0;right:0;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:18px;
    color:#6d655b;letter-spacing:.04em}
</style>
</head>
<body>
  <div class="band top"></div>
  <div class="band bot"></div>
  <div class="frame"></div>
  <div class="spqr">Senatus · Populusque · Vibes</div>
  <h1>You are a Bitcoin God.</h1>
  <div class="rule"><i></i><span>✦</span><i class="r"></i></div>
  <div class="creed">Core has rules. Knots has opinions. <b>Vibes has you.</b></div>
  <div class="foot">a Bitcoin node that rewrites its own source code, on request</div>
</body>
</html>
