# Publish a release: prebuilt nodes, the Mac app, and the installer for exactly
# this version.
#
# Compiling is unavoidable for changing the node, but it is not needed to run
# it. These artifacts let the installer bring a node up quickly and defer the
# compile until the operator's first experiment.
#
# Every artifact records the commit it was built from. The installer refuses a
# binary that does not match its source, because a node built from other code is
# not the node the operator is about to start editing.
#
# Nothing is published unless every platform builds and passes its tests: the
# builds upload their files as workflow artifacts, and a single final job
# publishes them together. A release is either complete or absent.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true
      prerelease:
        description: "Publish a closed-beta prerelease without changing the stable latest release"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      # Secrets cannot be read in a step's `if`, so their presence is noted here.
      HAVE_SIGNING_CERT: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prerelease) && secrets.VIBES_CODESIGN_P12_BASE64 != '' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            label: macOS (Apple silicon)
            slug: macos-arm64
          - os: ubuntu-24.04
            label: Linux (x86_64)
            slug: linux-x86_64
          - os: ubuntu-24.04-arm
            label: Linux (ARM64)
            slug: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Verify the immutable release target and runner architecture
        run: |
          set -eu
          case "$PRERELEASE" in
            true) printf '%s\n' "$TAG" | grep -Eq '^beta-v[0-9]+\.[0-9]+-[0-9]+$' ;;
            false) printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+-[0-9]+$' ;;
            *) echo "::error::Invalid release channel"; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          # Dispatch from the tag (or its exact commit), so provenance describes
          # the source actually checked out rather than an unrelated master.
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          case "${{ matrix.slug }}:$(uname -m)" in
            linux-x86_64:x86_64|linux-arm64:aarch64|linux-arm64:arm64|macos-arm64:arm64) ;;
            *) echo "::error::runner architecture does not match the archive name"; exit 1 ;;
          esac

      # The default Xcode is too old — AppleClang 15 lacks CTAD for aggregates,
      # which src/util/overloaded.h requires. Homebrew's LLVM is new enough but
      # its libc++ collides with Apple's SDK headers, so use the newest Xcode
      # the image carries and Apple's own toolchain.
      - name: Use the newest Xcode on this image
        if: runner.os == 'macOS'
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] || latest=/Applications/Xcode.app
          echo "selecting $latest"
          sudo xcode-select -s "$latest"
          c++ --version | head -1

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja boost capnp

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            libboost-dev libsqlite3-dev libcapnp-dev capnproto

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mac_args=()
          if [ "${{ runner.os }}" = "macOS" ]; then
            SDK=$(xcrun --show-sdk-path)
            test -f "$SDK/usr/lib/libsqlite3.tbd"
            test -f "$SDK/usr/include/sqlite3.h"
            mac_args=(-DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
              "-DSQLite3_LIBRARY=$SDK/usr/lib/libsqlite3.tbd"
              "-DSQLite3_INCLUDE_DIR=$SDK/usr/include")
          fi
          # Release, not the default RelWithDebInfo: on Linux that embedded
          # 276MB of DWARF straight into the ELF (macOS hid the problem by
          # keeping debug info in a separate .dSYM).
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DBUILD_GUI=OFF \
            -DENABLE_IPC=OFF "${mac_args[@]}"
          # Only the monolithic node and CLI are distributed. Disabling the
          # optional multiprocess target keeps bitcoin-cli independent of
          # builder-installed Cap'n Proto/KJ shared libraries.
          cmake --build build -j"$(getconf _NPROCESSORS_ONLN)" --target bitcoind bitcoin-cli test_bitcoin

      # Ship nothing that has not passed the tests the product itself relies on.
      - name: Bitcoin Core's unit tests
        run: ./build/bin/test_bitcoin --log_level=error

      - name: Console tests, against the node just built
        env:
          VIBES_QA_BIN: ${{ github.workspace }}/build/bin
        run: python3 -m unittest discover -s contrib/vibes/tests -v

      # Ship nothing that cannot prove it is a node.
      - name: Prove it validates
        run: |
          set -e
          DD=$(mktemp -d)
          ./build/bin/bitcoind -datadir="$DD" -chain=regtest -server=1 -listen=0 -daemon
          for i in $(seq 1 40); do
            ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest getblockcount >/dev/null 2>&1 && break
            sleep 1
          done
          ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest createwallet ci >/dev/null
          A=$(./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest -rpcwallet=ci getnewaddress)
          ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest generatetoaddress 101 "$A" >/dev/null
          test "$(./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest getblockcount)" = "101"
          ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest stop
          # `stop` returns as soon as the RPC is accepted, not when the process
          # is gone — and strip cannot modify a running binary ("Text file
          # busy"). Wait for it to actually exit.
          for i in $(seq 1 60); do
            pgrep -f "bitcoind -datadir=$DD" >/dev/null 2>&1 || break
            sleep 1
          done
          if pgrep -f "bitcoind -datadir=$DD" >/dev/null 2>&1; then
            echo "::error::bitcoind did not exit after stop"
            exit 1
          fi

      # Strip, and prove it worked. The previous version swallowed every error
      # into "2>/dev/null || true" and shipped a 292MB binary — 276MB of it
      # debug sections — while reporting success.
      - name: Strip and check the size
        run: |
          set -e
          strip -S build/bin/bitcoind build/bin/bitcoin-cli || \
            strip build/bin/bitcoind build/bin/bitcoin-cli
          if [ "${{ runner.os }}" = "macOS" ]; then
            for program in build/bin/bitcoind build/bin/bitcoin-cli; do
              codesign --force --sign - "$program"
              codesign --verify --strict "$program"
            done
          fi
          ./build/bin/bitcoind -version
          ./build/bin/bitcoin-cli -version
          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L build/bin/bitcoind build/bin/bitcoin-cli
            otool -l build/bin/bitcoind build/bin/bitcoin-cli | grep -A5 LC_BUILD_VERSION
          else
            ldd build/bin/bitcoind build/bin/bitcoin-cli
          fi
          ls -lh build/bin/bitcoind build/bin/bitcoin-cli
          # A Raspberry Pi on home broadband is the worst audience to hand a
          # bloated download, so make the bloat a red X on our run instead.
          BYTES=$(wc -c < build/bin/bitcoind)
          echo "bitcoind is $((BYTES / 1048576)) MiB"
          if [ "$BYTES" -gt 62914560 ]; then
            echo "::error::bitcoind is $((BYTES / 1048576)) MiB — expected well under 60. Debug info is probably still embedded."
            exit 1
          fi

      # The app fetches the source of its own release, so the release tag is
      # stamped into its launcher before it is built.
      - name: Stamp the launcher with this release
        if: runner.os == 'macOS'
        run: |
          set -e
          test "$(grep -c '^PINNED_REF=""$' contrib/vibes/macos/launcher.sh)" = "1"
          test "$(grep -c '^PINNED_COMMIT=""$' contrib/vibes/macos/launcher.sh)" = "1"
          test "$(grep -c '^PINNED_BETA=""$' contrib/vibes/macos/launcher.sh)" = "1"
          sed -i '' "s/^PINNED_REF=\"\"\$/PINNED_REF=\"$TAG\"/" contrib/vibes/macos/launcher.sh
          SHA=$(git rev-parse HEAD)
          sed -i '' "s/^PINNED_COMMIT=\"\"\$/PINNED_COMMIT=\"$SHA\"/" contrib/vibes/macos/launcher.sh
          if [ "$PRERELEASE" = true ]; then
            sed -i '' 's/^PINNED_BETA=""$/PINNED_BETA="1"/' contrib/vibes/macos/launcher.sh
          fi
          grep -n '^PINNED_REF=' contrib/vibes/macos/launcher.sh

      # Signing is optional. With no secrets the app is ad-hoc signed and not
      # notarised, and the release notes say so. The secrets do not exist yet,
      # so the signed path below has never run.
      - name: Import the signing certificate, if one is configured
        if: runner.os == 'macOS' && env.HAVE_SIGNING_CERT == 'true'
        env:
          P12: ${{ secrets.VIBES_CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.VIBES_CODESIGN_P12_PASSWORD }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/vibes-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      # The README offers "download the app" from /releases/latest, so every
      # release has to carry it — otherwise that link 404s the moment a
      # node-only release becomes the latest one.
      - name: Build the Mac app
        if: runner.os == 'macOS'
        shell: bash
        env:
          VIBES_CODESIGN_IDENTITY: ${{ env.PRERELEASE != 'true' && secrets.VIBES_CODESIGN_IDENTITY || '' }}
          VIBES_NOTARY_APPLE_ID: ${{ env.PRERELEASE != 'true' && secrets.VIBES_NOTARY_APPLE_ID || '' }}
          VIBES_NOTARY_TEAM_ID: ${{ env.PRERELEASE != 'true' && secrets.VIBES_NOTARY_TEAM_ID || '' }}
          VIBES_NOTARY_PASSWORD: ${{ env.PRERELEASE != 'true' && secrets.VIBES_NOTARY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          sh contrib/vibes/macos/build-app.sh --dmg | tee "$RUNNER_TEMP/app-build.log"
          ls -lh dist/BitcoinVibes.dmg
          grep 'signing:' "$RUNNER_TEMP/app-build.log" | sed 's/^ *signing: //' > mac-signing.txt

      - name: Package
        run: |
          set -e
          SHA=$(git rev-parse HEAD)
          DIR="vibes-node-${{ matrix.slug }}"
          mkdir -p out "$DIR"
          cp build/bin/bitcoind build/bin/bitcoin-cli "$DIR"/
          # The installer reads this to decide whether the binary matches its source.
          printf '%s\n' "$SHA" > "$DIR/COMMIT"
          tar -czf "out/$DIR.tar.gz" "$DIR"
          (cd out && shasum -a 256 "$DIR.tar.gz" > "$DIR.tar.gz.sha256")
          if [ -f dist/BitcoinVibes.dmg ]; then cp dist/BitcoinVibes.dmg mac-signing.txt out/; fi
          ls -lh out

      # The three ready-made experiments that change source each need a node
      # built with that change. Building them here means a newcomer watches a
      # real node refuse a real block without owning a compiler. Each is built
      # from exactly one bundled patch on top of the release commit, checked to
      # disagree with the unmodified node in the documented direction, and
      # shipped beside the SHA-256 of the patch it was built from. These nodes
      # do NOT follow Bitcoin's rules and the lab runs them only on a throwaway
      # private chain, inside its sandbox.
      - name: Build the changed nodes for the ready-made experiments
        run: |
          set -e
          SHA=$(git rev-parse HEAD)
          DIR="vibes-variants-${{ matrix.slug }}"
          mkdir -p "$DIR" stock
          cp build/bin/bitcoind stock/
          printf '%s\n' "$SHA" > "$DIR/COMMIT"
          : > "$DIR/PATCHES"
          build_variant() {
            name=$1; want=$2
            git apply "contrib/vibes/experiments/$name.diff"
            cmake --build build -j"$(getconf _NPROCESSORS_ONLN)" --target bitcoind
            git checkout -- src/
            mkdir -p "$DIR/$name" "candidate-$name" "lab-$name"
            cp build/bin/bitcoind "candidate-$name/"
            strip -S "candidate-$name/bitcoind" || strip "candidate-$name/bitcoind"
            if [ "${{ runner.os }}" = "macOS" ]; then
              codesign --force --sign - "candidate-$name/bitcoind"
              codesign --verify --strict "candidate-$name/bitcoind"
            fi
            "candidate-$name/bitcoind" -version
            python3 -I contrib/vibes/lab_runner.py --scene compare --reference stock \
              --candidate "candidate-$name" --workdir "lab-$name" --ports 18511,18512,18513,18514 > lab.out
            got=$(python3 -c "import json; print([json.loads(l)['result']['verdict'] for l in open('lab.out') if '\"result\"' in l][0])")
            echo "$name: expected $want, observed $got"
            test "$got" = "$want"
            cp "candidate-$name/bitcoind" "$DIR/$name/bitcoind"
            printf '%s  %s\n' "$(shasum -a 256 "contrib/vibes/experiments/$name.diff" | cut -d' ' -f1)" "$name" >> "$DIR/PATCHES"
          }
          build_variant double-reward loosened
          build_variant halve-reward tightened
          build_variant faster-halving tightened
          cat "$DIR/PATCHES"
          tar -czf "out/$DIR.tar.gz" "$DIR"
          (cd out && shasum -a 256 "$DIR.tar.gz" > "$DIR.tar.gz.sha256")
          ls -lh out

      - name: Verify the packaged native programs and provenance
        run: |
          SHA=$(git rev-parse HEAD)
          python3 contrib/vibes/tests/verify_release.py --assets out --platform '${{ matrix.slug }}' --tag "$TAG" --commit "$SHA"
          if [ "${{ runner.os }}" = "macOS" ]; then
            python3 contrib/vibes/tests/verify_release.py --dmg out/BitcoinVibes.dmg --tag "$TAG" --commit "$SHA"
          fi

      # The tag exists before this run; the launcher fetches it normally.
      # Programs come from the candidate archives, so publication is blocked
      # if automatic first-run setup fails. No extra files enter out/.
      - name: Verify full installer and cold shipped-app first launch
        run: |
          python3 contrib/vibes/tests/verify_release.py --first-launch-assets out --platform '${{ matrix.slug }}' \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$(git rev-parse HEAD)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.slug }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the release
      id-token: write        # sign the build provenance attestation
      attestations: write    # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      # The installer published with a release installs that release. The tag
      # is stamped in here; the line it replaces is empty in the repository.
      - name: Stamp the installer with this release
        run: |
          set -e
          test "$(grep -c '^PINNED_REF=""$' contrib/vibes/install.sh)" = "1" \
            || { echo "::error::install.sh must contain exactly one line PINNED_REF=\"\""; exit 1; }
          sed "s/^PINNED_REF=\"\"\$/PINNED_REF=\"$TAG\"/" contrib/vibes/install.sh > assets/install.sh
          grep -n '^PINNED_REF=' assets/install.sh
          sh -n assets/install.sh

      - name: Checksums for every asset
        run: |
          set -e
          cd assets
          mv mac-signing.txt ../mac-signing.txt 2>/dev/null || echo "not built" > ../mac-signing.txt
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Verify the complete release before publishing anything
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          python3 contrib/vibes/tests/verify_release.py --assets assets --tag "$TAG" --commit "$(git rev-parse HEAD)"

      # Says which workflow run, on which commit of this repository, produced
      # each file. Anyone can check one with:
      #   gh attestation verify FILE --repo hotpixelgroup/bitcoin
      # It ties a file to this repository's automation. It is not a maintainer's
      # signature, and it does not vouch for the source itself.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      # Signing the tag needs the maintainer's own key, which automation does
      # not hold. Report what was found; do not fail on it.
      - name: Is the tag signed?
        run: |
          if git cat-file -t "refs/tags/$TAG" 2>/dev/null | grep -q '^tag$' \
             && git cat-file tag "refs/tags/$TAG" | grep -q -e '-----BEGIN PGP SIGNATURE-----' -e '-----BEGIN SSH SIGNATURE-----'; then
            echo "signed" > tag-signing.txt
          else
            echo "not signed" > tag-signing.txt
          fi
          echo "Tag $TAG is $(cat tag-signing.txt)." >> "$GITHUB_STEP_SUMMARY"

      - name: Release notes
        run: |
          COMMIT=$(git rev-parse "$TAG^{commit}")
          UPSTREAM=$(sed -n 's/^commit=//p' contrib/vibes/UPSTREAM)
          UPSTREAM_KIND=$(sed -n 's/^kind=//p' contrib/vibes/UPSTREAM)
          : > notes.md
          if [ "$PRERELEASE" = true ]; then
            cat >> notes.md <<EOF
          **Closed-beta candidate.** This prerelease is for the invited test cohort and does not replace the stable latest release. Follow the [tester guide](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/doc/vibes-beta.md), use a separate private-chain lab, and report the exact candidate version. Signing remains deferred; the Mac app is ad-hoc signed and not notarised.

          EOF
          fi
          printf '## Install\n\n' >> notes.md
          if [ "$PRERELEASE" = true ]; then
            cat >> notes.md <<EOF
          Follow the [closed-beta tester guide](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/doc/vibes-beta.md) to check your download and install into a new, separate lab. The Mac download contains **Bitcoin Vibes Beta.app**, with its own app identity and per-candidate lab. Do not use stable \`latest\` links for this beta. If macOS or endpoint protection blocks installation, record the warning and stop; do not disable protections or remove quarantine attributes.

          EOF
          else
            cat >> notes.md <<EOF
          \`\`\`bash
          curl -fsSL https://github.com/hotpixelgroup/bitcoin/releases/download/$TAG/install.sh | sh
          \`\`\`

          This installer installs exactly this release. On a Mac you can instead download \`BitcoinVibes.dmg\`.

          EOF
          fi
          cat >> notes.md <<EOF
          ## What is here

          | File | What it is |
          |---|---|
          | \`install.sh\` | The installer, pinned to this release |
          | \`vibes-node-*.tar.gz\` | Ready-made node programs with unmodified Bitcoin Core consensus rules, one per platform |
          | \`vibes-variants-*.tar.gz\` | Three nodes with one deliberately changed rule each, for the ready-made experiments. They do not follow Bitcoin's rules; the lab runs them only on a private test chain, inside its sandbox |
          | \`BitcoinVibes.dmg\` | The Mac launcher app |
          | \`SHA256SUMS\` | SHA-256 of every file above |

          Built from commit \`$COMMIT\`, based on $UPSTREAM_KIND (\`$UPSTREAM\`). Every platform passed Bitcoin Core's unit tests and this project's own tests before anything was published.

          ## Verifying a download

          \`\`\`bash
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify install.sh --repo hotpixelgroup/bitcoin
          \`\`\`

          The checksum detects a corrupted or swapped download. The attestation shows a file was built by this repository's release workflow from the commit above. Neither is a maintainer's signature: this release tag is **$(cat tag-signing.txt)**, and the Mac app is **$(cat mac-signing.txt)**.

          ## Changes

          - Keep selected text and baseline comparisons in place while the console receives updates. Show compilation and test progress in the experiment panel.
          - Save custom prediction notes locally and include them in learning exports. Show the configured Claude Code estimate limit before sending a request and label returned estimates in USD.
          - Updated the maintained upstream baseline to Bitcoin Core 32.1. The default node keeps its consensus rules; only the existing peer user-agent branding differs under source code.
          - Added a five-foundation learning path and Learning / Full lab views. The landing page now leads with learning through evidence.
          - Added three real two-node experiments: inputs and change, transaction size and total fees, and watch-only wallets versus signing wallets. All 29 exact browser recordings were regenerated from Core 32.1.
          - Added an observation-by-observation evidence walkthrough, contextual definitions, plain takeaways and optional confidence, reasoning and reflection notes.
          - Added varied practice and local later-review suggestions. Original scores remain separate; each day's first practice answer and each run's first reflection are preserved. Downloads include both records. No study data is uploaded automatically.
          - Added clearly labeled browser models for proof of work, address reuse and a single Lightning channel. These are illustrative models, not Bitcoin nodes or real payments.
          - Pinned current workflow actions and browser QA dependencies, expanded learner-journey and accessibility tests, and kept cold-launch, sandbox, persistence and public-download checks.
          - Tested two Claude Code requests end to end on macOS with private regtest chains, including review, builds, activation and restore. A learner observation sheet and seven-day follow-up protocol are available. Apple signing and notarisation are deferred.
          - The Mac bundle identifies this release as \`$(printf '%s' "$TAG" | sed 's/^beta-//;s/^v//;s/-/./')\`. Beta launchers use a separate lab by default; stable launchers preserve an existing lab. Use the tester guide for the pinned beta rather than taking source updates midway through a session.
          - Prepared archives contain the monolithic node and CLI with optional multiprocess IPC disabled, so no Cap'n Proto/KJ shared libraries from the builder are needed to run them.
          - The prepared Mac app and programs require **Apple silicon and macOS 15 or later**. Their final load commands are checked for that minimum and for system-only libraries. Other Mac configurations require a compatible source build and are not verified by this release workflow.
          EOF
          cat notes.md

      # Created as a draft and published only once every file is attached, so
      # "the latest release" never points at one that is missing its installer
      # or its checksums.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          name: Bitcoin Vibes ${{ env.TAG }}
          draft: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: assets/*
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          expected=$(find assets -maxdepth 1 -type f | wc -l)
          attached=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          if [ "$attached" -ne "$expected" ]; then
            echo "::error::Only $attached of $expected files are attached; the release stays a draft."
            exit 1
          fi
          case "$PRERELEASE" in
            true) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true --latest=false ;;
            false) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=true ;;
            *) echo "::error::Invalid release channel"; exit 1 ;;
          esac

  verify-public-downloads:
    name: Public downloads (${{ matrix.slug }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slug: linux-x86_64
          - os: ubuntu-24.04-arm
            slug: linux-arm64
          - os: macos-15
            slug: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      # A fresh runner, with no build/dependency installation. This uses the
      # actual public URLs and the release's pinned installer, never mock nodes.
      - name: Verify public full installer and cold shipped-app first launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 contrib/vibes/tests/verify_release.py --public --platform '${{ matrix.slug }}' \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$(git rev-parse HEAD)"
