# Bitcoin Vibes CI.
#
# Upstream's own workflow is disabled on this fork — it is an enormous matrix
# aimed at a project with a hundred contributors and it starved everything else
# in the queue. This is the small, fast replacement that checks the things this
# project can actually break.
#
# Actions are pinned to full commit hashes, with the version in a comment, so a
# moved tag cannot change what runs here.
name: Vibes

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    name: Console, installer and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Console compiles
        run: |
          python3 -m py_compile contrib/vibes/bitcoin-vibes contrib/vibes/lab_runner.py \
            contrib/vibes/build_site.py contrib/vibes/vibeslib/*.py

      - name: Shell scripts parse
        run: |
          for script in vibes contrib/vibes/install.sh contrib/vibes/docker-entrypoint.sh \
                        contrib/vibes/macos/launcher.sh contrib/vibes/macos/build-app.sh; do
            sh -n "$script"
          done

      - name: Installer dry run touches nothing
        run: |
          VIBES_DRY_RUN=1 VIBES_DIR=/tmp/vibes-dry sh contrib/vibes/install.sh
          test ! -e /tmp/vibes-dry || (echo "dry run created files"; exit 1)

      - name: Console UI is well formed
        run: |
          python3 - <<'PY'
          import re, sys
          html = open("contrib/vibes/index.html").read()
          fails = []
          for tag in ("html", "head", "body", "script", "main", "dialog"):
              # <head must not also match <header
              if len(re.findall(rf"<{tag}[ >]", html)) != html.count(f"</{tag}>"):
                  fails.append(f"unbalanced <{tag}>")
          ids = re.findall(r'\bid="([^"]+)"', html)
          for dup in sorted({i for i in ids if ids.count(i) > 1}):
              fails.append(f"duplicate id {dup}")
          for needed in ("wish", "feed", "comparison-rows", "node-alerts", "predict-dialog"):
              if needed not in ids:
                  fails.append(f"console lost #{needed}")
          if 'label class="wish-label" for="wish"' not in html:
              fails.append("the request box lost its label")
          # The page is served with a strict content security policy.
          if re.search(r"<script(?![^>]*\bsrc=)", html) or " style=" in html or re.search(r'\son\w+="', html):
              fails.append("inline script, style or event handler (blocked by the page's CSP)")
          # Every id the script looks up must exist in the page.
          js = open("contrib/vibes/web/app.js").read()
          for wanted in sorted(set(re.findall(r"\$\('([a-z0-9-]+)'\)", js))):
              if wanted not in ids:
                  fails.append(f"app.js uses #{wanted}, which the page does not have")
          print("\n".join(fails) or "console UI ok")
          sys.exit(1 if fails else 0)
          PY

      - name: Console workflows, safety rules and failure recovery
        run: python3 -m unittest discover -s contrib/vibes/tests -v

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: JavaScript parses and static site builds
        run: |
          for script in contrib/vibes/web/*.js; do node --check "$script"; done
          python3 contrib/vibes/build_site.py --out /tmp/vibes-site
          node --check /tmp/vibes-site/web/lessons.js

      - name: Browser workflows and accessibility
        run: |
          npm install --prefix /tmp/vibes-browser --no-audit --no-fund playwright axe-core
          /tmp/vibes-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 21880 --bind 127.0.0.1 --directory /tmp/vibes-site > /tmp/vibes-http.log 2>&1 &
          VIBES_HTTP_PID=$!
          trap 'kill "$VIBES_HTTP_PID"' EXIT
          export NODE_PATH=/tmp/vibes-browser/node_modules
          node contrib/vibes/tests/browser_qa.cjs
          node contrib/vibes/tests/accessibility_qa.cjs


  node:
    name: Node builds and validates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The rule this project is strict about: whatever an experiment did to
      # somebody else's node, the default everyone installs stays stock Bitcoin
      # Core. Compare with the recorded upstream base, not with two greps.
      - name: A fresh install differs from Bitcoin Core in one file
        run: |
          set -e
          BASE=$(sed -n 's/^commit=//p' contrib/vibes/UPSTREAM)
          git fetch --depth 1 https://github.com/bitcoin/bitcoin.git "$BASE"
          CHANGED=$(git diff --name-only FETCH_HEAD HEAD -- src/)
          echo "files under src/ that differ from Bitcoin Core $BASE:"
          echo "$CHANGED"
          test "$CHANGED" = "src/clientversion.cpp" \
            || { echo "::error::src/ differs from the upstream base in more than src/clientversion.cpp. The shipped default must not fork."; exit 1; }
          grep -q 'MAX_MONEY = 21000000 \* COIN' src/consensus/amount.h
          grep -q 'nSubsidy = 50 \* COIN' src/validation.cpp

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 ccache bubblewrap \
            libboost-dev libsqlite3-dev libcapnp-dev capnproto

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build the node and Bitcoin Core's unit tests
        run: |
          cmake -B build -G Ninja \
            -DBUILD_TESTS=ON -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DBUILD_GUI=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j"$(nproc)" --target bitcoind bitcoin-cli test_bitcoin

      # The whole suite, not a selection: on unmodified source every test must
      # pass, and these are the tests the console later runs on each proposal.
      - name: Bitcoin Core's unit tests pass on the shipped source
        run: ./build/bin/test_bitcoin --log_level=error

      - name: Node starts, validates and answers
        run: |
          set -e
          DD=$(mktemp -d)
          ./build/bin/bitcoind -datadir="$DD" -chain=regtest -server=1 -daemon
          for i in $(seq 1 30); do
            ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest getblockcount >/dev/null 2>&1 && break
            sleep 1
          done
          ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest createwallet ci >/dev/null
          ADDR=$(./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest -rpcwallet=ci getnewaddress)
          ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest generatetoaddress 101 "$ADDR" >/dev/null
          H=$(./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest getblockcount)
          SUB=$(./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest getblockstats "$H" '["subsidy"]' | grep -o '[0-9]\+')
          echo "height=$H subsidy=$SUB"
          test "$H" = "101" || { echo "::error::node did not mine to 101"; exit 1; }
          test "$SUB" = "5000000000" || { echo "::error::subsidy is $SUB, expected 5000000000 (50 BTC)"; exit 1; }
          ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest stop

      # Hosted Ubuntu images restrict unprivileged user namespaces, which
      # bubblewrap needs. Lifting that here lets the Linux sandbox be exercised
      # for real. The job fails if it still cannot start: the steps below are
      # only evidence about the sandbox if they ran inside it.
      - name: The Linux sandbox is available
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "contrib/vibes")
          from vibeslib.sandbox import Sandbox
          box = Sandbox(".", ".vibes")
          print("sandbox:", box.kind, box.reason)
          if box.kind != "bwrap":
              sys.exit("::error::bubblewrap could not start on this runner, so the Linux sandbox was not tested")
          PY

      # The same command the console uses to compile a proposal, run the way
      # the console runs it: no network, the build folder the only place it
      # may write, home and temporary folders hidden.
      - name: The node compiles inside the Linux sandbox
        run: |
          touch src/validation.cpp
          python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "contrib/vibes")
          from vibeslib.sandbox import Sandbox
          box = Sandbox(".", ".vibes")
          scratch = os.path.abspath(".vibes/tmp/ci")
          os.makedirs(scratch, exist_ok=True)
          for step in (["cmake", "-B", "build"],
                       ["cmake", "--build", "build", "--target", "bitcoind", "-j", str(os.cpu_count() or 2)]):
              argv = box.wrap(step, write=[scratch, os.path.abspath("build")], network="none")
              code = subprocess.run(argv, env=box.clean_env(scratch), stdin=subprocess.DEVNULL).returncode
              if code:
                  sys.exit(f"::error::{' '.join(step)} failed inside the sandbox (exit {code})")
          PY
          ./build/bin/bitcoind -version | head -1

      - name: Console against a real node (two-node lab, activation, recovery)
        env:
          VIBES_QA_BIN: ${{ github.workspace }}/build/bin
        run: python3 -m unittest discover -s contrib/vibes/tests -v

      # The product's central claim, checked end to end: change one rule, and
      # an unmodified node disagrees in the predicted direction.
      - name: Ready-made experiments give their documented outcomes
        run: |
          set -e
          mkdir -p /tmp/stock && cp build/bin/bitcoind /tmp/stock/
          lab() {
            work=$(mktemp -d)
            python3 -I contrib/vibes/lab_runner.py --scene "$1" --reference /tmp/stock \
              --candidate "$2" --workdir "$work" --ports 18501,18502,18503,18504 $3 > /tmp/lab.out
            python3 -c "import json; r=[json.loads(l) for l in open('/tmp/lab.out')][-1]; print(r['result']['$4'] if r['t']=='result' else 'ERROR: '+r['detail'])"
          }
          expect() {
            echo "$1: expected '$2', observed '$3'"
            case "$3" in "$2"*) ;; *) cat /tmp/lab.out; echo "::error::$1 gave '$3', expected '$2'"; exit 1 ;; esac
          }
          check() {
            patch=$1; want=$2
            git apply "contrib/vibes/experiments/$patch.diff"
            cmake --build build -j"$(nproc)" --target bitcoind
            git checkout -- src/
            mkdir -p "/tmp/$patch" && cp build/bin/bitcoind "/tmp/$patch/"
            expect "$patch" "$want" "$(lab compare "/tmp/$patch" "" verdict)"
          }
          check double-reward loosened
          check halve-reward tightened
          check faster-halving tightened
          # The scenes that put a changed node beside the unmodified one.
          expect "rule-breaking miner" "Thirty blocks of mining power, refused" "$(lab miners /tmp/double-reward "" headline)"
          expect "30% of mining power" "With 30% of mining power, the stricter nodes were left" "$(lab power /tmp/halve-reward "--share 30" headline)"
          expect "70% of mining power" "With 70% of mining power, the stricter rule became" "$(lab power /tmp/halve-reward "--share 70" headline)"
