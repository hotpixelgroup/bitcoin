# Bitcoin Vibes CI.
#
# Upstream's own workflow is disabled on this fork — it is an enormous matrix
# aimed at a project with a hundred contributors and it starved everything else
# in the queue. This is the small, fast replacement that checks the things this
# project can actually break.
name: Vibes

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    name: Console, installer and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Console compiles
        run: python3 -m py_compile contrib/vibes/bitcoin-vibes

      - name: Shell scripts parse
        run: |
          sh -n contrib/vibes/install.sh
          sh -n vibes

      - name: Installer dry run touches nothing
        run: |
          VIBES_DRY_RUN=1 VIBES_DIR=/tmp/vibes-dry sh contrib/vibes/install.sh
          test ! -e /tmp/vibes-dry || (echo "dry run created files"; exit 1)

      - name: Console UI is well formed
        run: |
          python3 - <<'PY'
          import re, sys
          html = open("contrib/vibes/index.html").read()
          fails = []
          for tag in ("html", "head", "body", "script", "style"):
              # <head must not also match <header
              if len(re.findall(rf"<{tag}[ >]", html)) != html.count(f"</{tag}>"):
                  fails.append(f"unbalanced <{tag}>")
          if "wish" not in html or 'id="feed"' not in html:
              fails.append("console lost a core element")
          # every input the form reads must still exist by id
          if 'label class="wish-label" for="wish"' not in html:
              fails.append("the decree box lost its label")
          print("\n".join(fails) or "console UI ok")
          sys.exit(1 if fails else 0)
          PY

      - name: Console integration and failure recovery
        run: python3 -m unittest discover -s contrib/vibes/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript parses and static site builds
        run: |
          node --check contrib/vibes/web/app.js
          node --check contrib/vibes/web/demo.js
          python3 contrib/vibes/build_site.py --out /tmp/vibes-site

      - name: Browser workflows and accessibility
        run: |
          npm install --prefix /tmp/vibes-browser --no-audit --no-fund playwright axe-core
          /tmp/vibes-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 21880 --bind 127.0.0.1 --directory /tmp/vibes-site > /tmp/vibes-http.log 2>&1 &
          VIBES_HTTP_PID=$!
          trap 'kill "$VIBES_HTTP_PID"' EXIT
          export NODE_PATH=/tmp/vibes-browser/node_modules
          node contrib/vibes/tests/browser_qa.cjs
          node contrib/vibes/tests/accessibility_qa.cjs


  node:
    name: Node builds and validates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 ccache \
            libboost-dev libsqlite3-dev libcapnp-dev capnproto

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DBUILD_GUI=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j"$(nproc)"

      # The rule this project is strict about: whatever a decree did to somebody
      # else's node, the default everyone installs stays stock Bitcoin Core.
      - name: A fresh install still ships Core's consensus
        run: |
          set -e
          grep -q 'MAX_MONEY = 21000000 \* COIN' src/consensus/amount.h \
            || { echo "::error::MAX_MONEY is not 21,000,000 — the shipped default must not fork"; exit 1; }
          grep -q 'nSubsidy = 50 \* COIN' src/validation.cpp \
            || { echo "::error::block subsidy is not 50 BTC — the shipped default must not fork"; exit 1; }
          echo "consensus defaults intact"

      - name: Node starts, validates and answers
        run: |
          set -e
          DD=$(mktemp -d)
          ./build/bin/bitcoind -datadir="$DD" -chain=regtest -server=1 -daemon
          for i in $(seq 1 30); do
            ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest getblockcount >/dev/null 2>&1 && break
            sleep 1
          done
          ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest createwallet ci >/dev/null
          ADDR=$(./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest -rpcwallet=ci getnewaddress)
          ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest generatetoaddress 101 "$ADDR" >/dev/null
          H=$(./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest getblockcount)
          SUB=$(./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest getblockstats "$H" '["subsidy"]' | grep -o '[0-9]\+')
          echo "height=$H subsidy=$SUB"
          test "$H" = "101" || { echo "::error::node did not mine to 101"; exit 1; }
          test "$SUB" = "5000000000" || { echo "::error::subsidy is $SUB, expected 5000000000 (50 BTC)"; exit 1; }
          ./build/bin/bitcoin-cli -datadir="$DD" -chain=regtest stop

      - name: Real console acceptance and transaction scenarios
        env:
          VIBES_QA_BIN: ${{ github.workspace }}/build/bin
        run: python3 -m unittest discover -s contrib/vibes/tests -v
