name: Something is broken
description: The node, the console, or the installer did something wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. You do not need to know C++ to file a good bug —
        "I clicked Manifest and nothing happened" is a perfectly good bug.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: What you did, and what it did instead.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations: {required: false}
  - type: dropdown
    id: where
    attributes:
      label: Where did it go wrong?
      options:
        - Installing it
        - Starting the console or the node
        - Issuing a decree (the text box)
        - The settings panel
        - The node itself — syncing, peers, RPC
        - Somewhere else
    validations: {required: true}
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1 / Ubuntu 24.04 / Debian in Docker
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Anything the terminal or console said
      description: Paste it as-is. Redact anything that looks like a key.
      render: text
    validations: {required: false}
