name: Something is missing
description: An idea for the node, the console, or the docs.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The project's goal is a real Bitcoin node that a non-technical person can
        actually run. Ideas pointed at that goal go to the front of the queue.
  - type: textarea
    id: idea
    attributes:
      label: What should it do?
    validations: {required: true}
  - type: textarea
    id: why
    attributes:
      label: Who does this help, and when?
      placeholder: "As someone who ..., I want ..., because right now I have to ..."
    validations: {required: false}
  - type: checkboxes
    id: consensus
    attributes:
      label: Does this change Bitcoin's consensus rules?
      options:
        - label: "No — or if yes, I understand a fresh install must still ship stock Core rules"
    validations: {required: true}
