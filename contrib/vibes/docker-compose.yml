# Bitcoin Vibes, zero host dependencies.
#
#   docker compose -f contrib/vibes/docker-compose.yml up --build
#
# Then open the http://127.0.0.1:21212/?key=… link printed in the logs.
services:
  vibes:
    build:
      context: ../..
      dockerfile: contrib/vibes/Dockerfile
    # Loopback-only: the console governs a node and must never face the network.
    ports:
      - "127.0.0.1:21212:21212"
    volumes:
      # The working copy: source, saved experiments (git commits), build
      # output and chain data. Kept across container and image rebuilds.
      - vibes-work:/home/vibes/work
      # Claude Code's own state for this container, login included. It is not
      # your machine's ~/.claude: the agent here never sees that folder. Sign
      # in once inside the container:
      #   docker compose -f contrib/vibes/docker-compose.yml exec vibes claude auth login
      - vibes-claude:/home/vibes/.claude
    # The container is the enclosure for AI-written code, so give it as little
    # as it needs: no extra privileges, and none to be gained.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true

volumes:
  vibes-work:
  vibes-claude:
